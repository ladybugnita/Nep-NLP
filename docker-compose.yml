# NepNLP full stack. Run everything with:  docker compose up --build
# Nothing else to install — Mongo, the Python ML service, the Java API and the
# React frontend all run as containers.

services:
  # ---------------------------------------------------------------- MongoDB
  mongo:
    image: mongo:7
    container_name: nepnlp-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------- ML service
  ml-service:
    build: ./ml-service
    container_name: nepnlp-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NEPNLP_MODELS_DIR: /app/models_store
    volumes:
      # Persist / hot-swap trained models without rebuilding the image
      - ./ml-service/models_store:/app/models_store
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health'); "]
      interval: 15s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------ Java backend
  backend:
    build: ./backend
    container_name: nepnlp-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/nepnlp
      NEPNLP_ML_BASE_URL: http://ml-service:8000
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_started

  # ---------------------------------------------------------- React frontend
  frontend:
    build: ./frontend
    # nginx serves the static build and proxies /api -> backend (same origin, no CORS).
    container_name: nepnlp-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
